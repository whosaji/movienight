<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Montserrat',sans-serif;
color:white;
background:#0b0610;
position:relative;
cursor:pointer;
}

/* Glow background */
body::before{
content:"";
position:absolute;
inset:-30%;
background:
radial-gradient(circle at 30% 40%, rgba(255,0,120,0.6), transparent 60%),
radial-gradient(circle at 70% 60%, rgba(255,40,140,0.4), transparent 60%);
animation:glow 8s ease-in-out infinite alternate;
filter:blur(120px);
z-index:0;
}

@keyframes glow{
0%{transform:scale(1);}
100%{transform:scale(1.3);}
}

/* Screens */
.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
opacity:0;
transform:scale(.95);
transition:all .6s ease;
z-index:2;
}

.screen.active{
opacity:1;
transform:scale(1);
}

h1,h2{
font-family:'Cormorant Garamond',serif;
font-size:2.4rem;
margin-bottom:20px;
text-shadow:0 0 25px rgba(255,0,120,.9);
}

p{
font-size:1.1rem;
opacity:.9;
margin-bottom:40px;
}

/* Cutting-edge button */
.alt-btn{
position:absolute;
padding:16px 32px;
font-size:0.95rem;
font-weight:500;
letter-spacing:1px;
text-transform:uppercase;
color:white;
background:linear-gradient(135deg, rgba(255,0,120,0.2), rgba(255,0,120,0.05));
border:1px solid rgba(255,255,255,0.2);
border-radius:18px;
backdrop-filter:blur(12px);
cursor:pointer;
transition:all .2s ease;
box-shadow:
0 0 20px rgba(255,0,120,0.3),
inset 0 0 10px rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<!-- GOOD MORNING SCREEN -->
<div id="screen1" class="screen active">
<h1>Buenos días, hermosa 💖</h1>
<p>Tap anywhere to continue</p>
</div>

<!-- RANDOM THOUGHT SCREEN -->
<div id="screen2" class="screen">
<h2>Random thought... 🤔</h2>
<p>Let's watch a movie online together?</p>
<button id="noBtn" class="alt-btn">
Nah, I'm cool on that
</button>
</div>

<script>
let currentScreen = 1;

/* Transition screens */
document.addEventListener("pointerdown", function(e){
if(currentScreen === 1){
document.getElementById("screen1").classList.remove("active");
document.getElementById("screen2").classList.add("active");
currentScreen = 2;

/* Center button initially */
const btn = document.getElementById("noBtn");
btn.style.left = "50%";
btn.style.top = "70%";
btn.style.transform = "translate(-50%, -50%)";
}
});

/* Random move logic */
const btn = document.getElementById("noBtn");
const screen2 = document.getElementById("screen2");

function moveButton(e){
e.stopPropagation();

const rect = screen2.getBoundingClientRect();
const btnRect = btn.getBoundingClientRect();

const maxX = rect.width - btnRect.width;
const maxY = rect.height - btnRect.height;

btn.style.transform = "none";
btn.style.left = Math.random() * maxX + "px";
btn.style.top = Math.random() * maxY + "px";
}

/* Universal input */
btn.addEventListener("pointerdown", moveButton);
</script>

</body>
</html>
