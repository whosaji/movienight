<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
font-family:'Montserrat',sans-serif;
color:white;
background:#0b0610;
position:relative;
}

/* Glow background */
body::before{
content:"";
position:absolute;
inset:-30%;
background:
radial-gradient(circle at 30% 40%, rgba(255,0,120,0.6), transparent 60%),
radial-gradient(circle at 70% 60%, rgba(255,40,140,0.4), transparent 60%);
animation:glow 8s ease-in-out infinite alternate;
filter:blur(120px);
z-index:0;
}

@keyframes glow{
0%{transform:scale(1);}
100%{transform:scale(1.3);}
}

.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
opacity:0;
transform:scale(.95);
transition:all .6s ease;
z-index:2;
}

.screen.active{
opacity:1;
transform:scale(1);
}

h1,h2{
font-family:'Cormorant Garamond',serif;
font-size:2.2rem;
margin-bottom:20px;
text-shadow:0 0 25px rgba(255,0,120,.9);
}

p{
font-size:1.1rem;
margin-bottom:40px;
max-width:600px;
}

/* Moving button */
.alt-btn{
position:absolute;
padding:14px 28px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
border-radius:16px;
cursor:pointer;
}

/* Static buttons */
.static-btn{
margin-top:140px;
padding:14px 32px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
border-radius:16px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
<h1>Buenos días, hermosa 💖</h1>
<p>Tap anywhere to continue</p>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
<h2>Random thought... 🤔</h2>
<p>Let's watch a movie online together?</p>

<button id="noBtn" class="alt-btn">
Nah, I'm cool on that
</button>

<button id="yesBtn" class="static-btn">
Yess
</button>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen">
<h2>Perfect,</h2>
<p>
Amma pick u up (virtually, ofc), later this evening @ 7:50 p.m. (2/22/2026)
</p>

<button class="static-btn">
Im not sure, if ill be available at that specific time
</button>
</div>

<script>
const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");
const screen3 = document.getElementById("screen3");
const btn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

/* SCREEN 1 → SCREEN 2 */
document.addEventListener("pointerdown", function(e){
if(screen1.classList.contains("active")){
screen1.classList.remove("active");
screen2.classList.add("active");
centerButton();
}
});

/* YES → SCREEN 3 */
yesBtn.addEventListener("pointerdown", function(e){
e.stopPropagation();
screen2.classList.remove("active");
screen3.classList.add("active");
});

/* Center moving button */
function centerButton(){
btn.style.left = (screen2.clientWidth/2 - btn.offsetWidth/2) + "px";
btn.style.top = (screen2.clientHeight*0.65) + "px";
}

/* Move button randomly */
function moveButton(e){
e.stopPropagation();

const maxX = screen2.clientWidth - btn.offsetWidth;
const maxY = screen2.clientHeight - btn.offsetHeight;

btn.style.left = Math.random() * maxX + "px";
btn.style.top = Math.random() * maxY + "px";
}

btn.addEventListener("pointerdown", moveButton);
</script>

</body>
</html>
