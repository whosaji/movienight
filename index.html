<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Montserrat',sans-serif;
color:white;
background:#0b0610;
position:relative;
user-select:text;
}

/* Glow background */
body::before{
content:"";
position:absolute;
inset:-30%;
background:
radial-gradient(circle at 30% 40%, rgba(255,0,120,0.6), transparent 60%),
radial-gradient(circle at 70% 60%, rgba(255,40,140,0.4), transparent 60%);
animation:glow 8s ease-in-out infinite alternate;
filter:blur(120px);
z-index:0;
pointer-events:none;
}

@keyframes glow{
0%{transform:scale(1);}
100%{transform:scale(1.3);}
}

/* Screens */
.screen{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
opacity:0;
transform:scale(.95);
transition:all .6s ease;
z-index:2;
pointer-events:none;
}

.screen.active{
opacity:1;
transform:scale(1);
pointer-events:auto;
}

h1,h2{
font-family:'Cormorant Garamond',serif;
font-size:2.2rem;
margin-bottom:20px;
text-shadow:0 0 25px rgba(255,0,120,.9);
}

p{
font-size:1.1rem;
margin-bottom:25px;
max-width:600px;
}

/* Standard button */
button{
padding:14px 28px;
margin-top:15px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
border-radius:16px;
cursor:pointer;
color:white;
backdrop-filter:blur(6px);
}

/* Button area for screen 2 */
.button-area{
position:relative;
width:100%;
height:240px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
}

/* Moving No button */
.alt-btn{
position:absolute;
}

/* Heart Yes button (glass texture) */
.heart-btn{
position:relative;
width:110px;
height:100px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
transform:rotate(-45deg);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
backdrop-filter:blur(6px);
margin-top:160px;
}

.heart-btn:before,
.heart-btn:after{
content:"";
position:absolute;
width:110px;
height:100px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
border-radius:50%;
}

.heart-btn:before{
top:-50px;
left:0;
}

.heart-btn:after{
left:50px;
top:0;
}

.heart-text{
transform:rotate(45deg);
font-weight:500;
pointer-events:none;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
<h1>Buenos días, hermosa 💖</h1>
<p>Tap anywhere to continue</p>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
<h2>Random thought... 🤔</h2>
<p>Let's watch a movie online together?</p>

<div class="button-area">
<button id="noBtn" class="alt-btn">Nah, I'm cool on that</button>

<button id="yesBtn" class="heart-btn">
<span class="heart-text">Yes</span>
</button>
</div>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen">
<h2>Perfect 💖</h2>
<p>You're the best.</p>
</div>

<script>
const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");
const screen3 = document.getElementById("screen3");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

/* Screen 1 → Screen 2 */
screen1.addEventListener("click", function(){
screen1.classList.remove("active");
screen2.classList.add("active");
centerButton();
}, { once: true });

/* Yes → Screen 3 */
yesBtn.addEventListener("click", function(){
screen2.classList.remove("active");
screen3.classList.add("active");
});

/* Position No button initially */
function centerButton(){
noBtn.style.left = (screen2.clientWidth/2 - noBtn.offsetWidth/2) + "px";
noBtn.style.top = "20px";
}

/* Make No button dodge */
noBtn.addEventListener("click", function(e){
e.stopPropagation();
const maxX = screen2.clientWidth - noBtn.offsetWidth;
const maxY = 180;
noBtn.style.left = Math.random() * maxX + "px";
noBtn.style.top = Math.random() * maxY + "px";
});
</script>

</body>
</html>
